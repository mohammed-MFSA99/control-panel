{{#> layout title="اضافة منتج" pageScript="/src/scripts/upload.js"}}

<div class="single-page">
    <header class="page-header">
        <h1 class="page-title">اضافة منتج</h1>
        <button class="c-btn c-btn--primary" type="submit" name="submit" form="add-product">اضافة منتج</button>
        <button class="c-btn" type="submit" name="draft" form="add-product">حفظ كمسودة</button>
    </header>
    <form action="" class="c-form" name="add-product">

        <div class="c-upload js-upload">
            <header class="c-upload__header">
                <h4 class="c-upload_title">صورة المنتج</h4>
                <label for="upload-image" class="c-upload__label">ارفع الصورة</label>
                <span class="c-upload__label c-upload__label--remove js-upload-remove">احذف الصورة</span>
            </header>
            <div class="c-upload__body">
                <div class="c-upload__image">
                    <img src="#" alt="" class="js-upload-placeholder">
                </div>
                <input type="file" name="upload-image" class="c-upload__field js-upload-value" accept="image/*">
                <span class="c-upload__subtitle">اسحب الصورة هنا لرفعها</span>
            </div>
        </div>
        <div class="c-form__controls">
            <div class="c-form__row">
                <div class="c-textfield">
                    <label for="product-name" class="c-textfield__label"> اسم المنتج</label>
                    <input type="text" class="c-textfield__input" placeholder="مثلا : قميص ابيض" id="product-name"
                        required>
                </div>
            </div>
            <div class="c-form__row">
                <div class="c-textfield">
                    <label for="product-price" class="c-textfield__label"> سعر المنتج</label>
                    <input type="text" class="c-textfield__input c-textfield__input--left" placeholder="$"
                        id="product-price" required>

                </div>
                <div class="c-textfield">
                    <label for="product-price2" class="c-textfield__label"> سعر الثانوي</label>
                    <input type="text" class="c-textfield__input c-textfield__input--left" placeholder="ريال"
                        id="product-price2" required>

                </div>
            </div>
            <div class="c-form__row">
                <div class="c-textfield">
                    <label for="textarea" class="c-textfield__label">وصف المنتج</label>
                    <textarea class="c-textfield__textarea" id="textarea" placeholder="ادخل الوصف"></textarea>
                </div>
            </div>

            <div class="c-form__row">
                <div class="c-textfield">
                    <label for="height" class="c-textfield__label"> الابعاد </label>
                    <input type="number" class="c-textfield__input" id="height" required>
                    <span class="c-textfield__hint">بالسنتيمتر</span>
                </div>
                <div class="c-textfield">
                    <label for="width" class="c-textfield__label"> <br /> </label>
                    <input type="number" class="c-textfield__input" id="width" required>
                </div>
                <div class="c-textfield">
                    <label for="depth" class="c-textfield__label">العمق </label>
                    <input type="number" class="c-textfield__input" id="depth" required>
                </div>
                <div class="c-textfield">
                    <label for="weight" class="c-textfield__label">الوزن </label>
                    <input type="number" class="c-textfield__input" id="weight" required>
                </div>

            </div>
        </div>

    </form>
</div>


{{/layout}}
